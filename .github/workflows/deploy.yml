name: Deploy static website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: static-website-deployment
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare static site
        run: |
          mkdir _site
          rsync -a --exclude='.git/' --exclude='.github/' --exclude='_site/' --exclude='.gitignore' --exclude='README.md' ./ _site/
          touch _site/.nojekyll
      - name: Publish to GitHub Pages branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: _site
          clean: true
